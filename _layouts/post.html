---
layout: default
---

<article class="story-content">
    <h1>{{ page.title }}</h1>
    <p class="story-meta">{{ page.date | date: "%B %d, %Y" }}{% if page.author %} • By {{ page.author }}{% endif %}</p>

    {{ content }}

    <a href="{{ '/' | relative_url }}" class="back-link">← Back to all stories</a>
</article>
