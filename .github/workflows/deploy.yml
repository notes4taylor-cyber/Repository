# Builds the Vite app and deploys the static `dist/` output to GitHub Pages.
#
# NOTE: This is currently MANUAL-ONLY (workflow_dispatch). GitHub Pages can't
# publish from a PRIVATE repo on the free plan, so auto-running on every push
# would just fail repeatedly. To turn on automatic deploys later, EITHER make
# the repo public OR upgrade to GitHub Pro, then add a `push:` trigger back:
#
#   on:
#     push:
#       branches: [claude/peaceful-edison-uotxx9]
#     workflow_dispatch:
#
# (You'll also need Settings -> Pages -> Source: "GitHub Actions".)
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `enablement: true` turns Pages on for the repo automatically on the
      # first run, so you don't have to flip it in Settings yourself.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
